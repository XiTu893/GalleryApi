name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gallery/Android/src/gradlew

    - name: Build Debug APK
      run: |
        cd gallery/Android/src
        ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.enableJetifier=false -Pandroid.useAndroidX=true
      env:
        GRADLE_OPTS: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

    - name: Rename APK with version and commit
      run: |
        APK_DIR="gallery/Android/src/app/build/outputs/apk/debug"
        VERSION_NAME="1.0.14"
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        NEW_NAME="GalleryApi-v${VERSION_NAME}-${SHORT_SHA}.apk"
        mv "${APK_DIR}/app-debug.apk" "${APK_DIR}/${NEW_NAME}"
        echo "APK_NAME=${NEW_NAME}" >> $GITHUB_ENV
        echo "APK_PATH=${APK_DIR}/${NEW_NAME}" >> $GITHUB_ENV

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.APK_PATH }}
        retention-days: 30

    - name: Upload Build Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: gallery/Android/src/app/build/reports/
        retention-days: 7

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        body: |
          Latest debug build from master branch.

          **Commit**: ${{ github.sha }}
          **Date**: ${{ github.event.head_commit.timestamp }}
          **Message**: ${{ github.event.head_commit.message }}

          ## Download
          Download the APK below and install on your Android device (API 31+).

          ## Usage
          1. Install the APK
          2. Open the app and download a model
          3. Go to Settings → API Service → Start
          4. Use `http://127.0.0.1:8080/v1/chat/completions` as your OpenAI-compatible endpoint
        files: ${{ env.APK_PATH }}
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
