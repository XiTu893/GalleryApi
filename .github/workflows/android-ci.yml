name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gallery/Android/src/gradlew

    - name: Build Release APK
      run: |
        cd gallery/Android/src
        ./gradlew assembleRelease --no-daemon --stacktrace -Pandroid.enableJetifier=false -Pandroid.useAndroidX=true
      env:
        GRADLE_OPTS: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

    - name: Rename APK with version and commit
      run: |
        APK_DIR="gallery/Android/src/app/build/outputs/apk/release"
        VERSION_NAME="1.0.16"
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        NEW_NAME="GalleryApi-v${VERSION_NAME}-${SHORT_SHA}.apk"
        ORIG_APK=$(ls "${APK_DIR}"/*.apk 2>/dev/null | head -1)
        if [ -z "$ORIG_APK" ]; then
          echo "ERROR: No APK found in ${APK_DIR}"
          ls -la "${APK_DIR}" || true
          exit 1
        fi
        APK_SIZE=$(stat -f%z "${ORIG_APK}" 2>/dev/null || stat -c%s "${ORIG_APK}" 2>/dev/null)
        echo "APK size: $(( APK_SIZE / 1024 / 1024 )) MB"
        mv "${ORIG_APK}" "${APK_DIR}/${NEW_NAME}"
        echo "APK_NAME=${NEW_NAME}" >> $GITHUB_ENV
        echo "APK_PATH=${APK_DIR}/${NEW_NAME}" >> $GITHUB_ENV

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: ${{ env.APK_PATH }}
        retention-days: 30

    - name: Upload Build Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: gallery/Android/src/app/build/reports/
        retention-days: 7

    - name: Delete old release assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | jq -r '.id')
        if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
          ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r '.[].id')
          for ASSET_ID in $ASSETS; do
            echo "Deleting old asset: $ASSET_ID"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          done
        fi

    - name: Create or Update GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        body: |
          Latest release build from master branch.

          **Commit**: ${{ github.sha }}
          **Date**: ${{ github.event.head_commit.timestamp }}
          **Message**: ${{ github.event.head_commit.message }}

          ## Download
          Download the APK below and install on your Android device (API 31+).

          ## Usage
          1. Install the APK
          2. Open the app and download a model
          3. Go to Settings → API Service → Start
          4. Use `http://<device-ip>:8080/v1/chat/completions` as your OpenAI-compatible endpoint
        files: ${{ env.APK_PATH }}
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
